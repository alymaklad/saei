<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sa'ei — Home</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="assets/saei-logo.png">
</head>
<body data-page="dashboard">
<main id="page">
  <div class="flex flex-col">

    <header class="sa-page-head">
      <div>
        <h1 class="sa-page-title"><span id="greeting">Welcome back.</span></h1>
        <p class="sa-page-desc" id="home-summary">Here's where your job search stands today.</p>
      </div>
      <div class="sa-page-actions">
        <a href="search.html" class="sa-btn-primary"><span class="ms text-[18px]">search</span>Search for jobs</a>
      </div>
    </header>

    <!-- Active trajectory -->
    <section class="sa-card mb-space-xl">
      <div class="mb-space-lg flex items-center justify-between">
        <span class="flex items-center gap-2 text-label-md font-semibold text-on-surface-variant">
          <span class="h-1.5 w-1.5 rounded-full bg-primary"></span>Your progress
        </span>
        <span class="text-label-md text-on-surface-variant" id="trajectory-stage"></span>
      </div>
      <div class="relative px-space-md">
        <div class="absolute left-[10%] right-[10%] top-[18px] h-px bg-secondary-fixed-dim"></div>
        <div class="relative grid grid-cols-5" id="trajectory"></div>
      </div>
    </section>


    <!-- Recent applications -->
    <section class="mb-space-lg">
      <div class="mb-space-md flex items-end justify-between">
        <div>
          <h2 class="text-headline-sm text-on-surface">Recent applications</h2>
        </div>
      </div>
      <div class="sa-list" id="recent-apps">
        <p class="sa-empty">Loading&hellip;</p>
      </div>
      <div class="mt-space-md flex justify-end">
        <a href="applications.html" class="flex items-center gap-1 text-label-md text-on-surface-variant hover:text-primary">View all applications <span class="ms text-[18px]">arrow_forward</span></a>
      </div>
    </section>

    <!-- Insight -->
    <div class="hidden items-center justify-between gap-space-md rounded-xl bg-surface-container-low px-space-lg py-space-md" id="insight">
      <p class="flex items-center gap-2 text-body-md text-on-surface-variant">
        <span class="ms text-[20px] text-tertiary">lightbulb</span>
        <span class="text-on-surface" id="insight-text"></span>
      </p>
      <a href="reports.html" class="flex items-center gap-1 whitespace-nowrap text-label-md text-primary hover:underline">See skill gaps <span class="ms text-[18px]">arrow_forward</span></a>
    </div>
  </div>
</main>

<script src="shell.js"></script>
<script src="config.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
