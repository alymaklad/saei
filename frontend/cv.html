<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sa'ei — CV</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="assets/saei-logo.png">
</head>
<body data-page="cv">
<main id="page">
  <div class="flex flex-col">
    <header class="sa-page-head">
      <div>
        <h1 class="sa-page-title">CV</h1>
        <p class="sa-page-desc">Your CV, and the version tailored for each role.</p>
      </div>
    </header>

    <!-- Master CV -->
    <section class="sa-card relative mb-space-xl overflow-hidden p-space-lg">
      <div class="relative" id="cv-current">
        <p class="sa-empty">Loading&hellip;</p>
      </div>
      <input type="file" id="cv-file-input" accept=".pdf,.docx" hidden>
      <p id="upload-message" class="save-message relative mt-space-sm"></p>
    </section>

    <!-- Tailored CVs -->
    <section class="mb-space-xl">
      <div class="mb-space-md flex items-end justify-between gap-space-md">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-headline-md text-on-surface">Tailored CVs</h2>
            <span class="rounded-full bg-secondary-container px-2 py-0.5 text-label-sm normal-case tracking-normal text-on-secondary-fixed-variant" id="cv-variant-chip"></span>
          </div>
        </div>
        <div class="flex items-center gap-space-sm">
          <label class="relative">
            <span class="ms pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant">search</span>
            <input type="text" id="cv-filter" class="sa-input w-56 bg-surface-container-lowest py-2 pl-9" placeholder="Filter role or company&hellip;">
          </label>
          <span class="text-label-md text-on-surface-variant">Sort:</span>
          <div class="sa-select-wrap">
            <select id="cv-sort" class="sa-select bg-surface-container py-1.5 text-label-md" aria-label="Sort">
              <option value="date">Most recent</option>
              <option value="lift">Biggest lift</option>
              <option value="score">Highest tailored ATS</option>
            </select>
          </div>
        </div>
      </div>
      <div class="overflow-hidden rounded-xl bg-surface-container-lowest shadow-soft">
        <div class="grid grid-cols-[1.2fr_1.2fr_1fr] gap-space-md bg-surface-container-low px-space-lg py-space-sm text-label-md font-semibold text-on-surface-variant">
          <span>Role</span><span>ATS score, before and after tailoring</span><span class="text-right">Created</span>
        </div>
        <div class="divide-y divide-surface-container px-space-lg" id="cv-rewrites-body">
          <p class="sa-empty">Loading&hellip;</p>
        </div>
        <div class="flex items-center justify-between gap-space-md bg-surface-container-low px-space-lg py-space-sm">
          <span></span>
          <button type="button" class="sa-btn-ghost whitespace-nowrap" id="cv-rewrites-more" hidden></button>
        </div>
      </div>
    </section>

    <!-- Bench -->
    <details class="group rounded-xl bg-surface-container-lowest shadow-soft" id="bench">
      <summary class="flex cursor-pointer list-none items-center justify-between gap-space-md p-space-lg">
        <span class="flex items-center gap-space-sm">
          <span class="sa-icon-badge"><span class="ms">science</span></span>
          <span>
            <span class="block text-headline-sm text-on-surface">Test against a job description</span>
            <span class="block text-body-sm text-on-surface-variant">Paste one to see your score and a tailored CV. Nothing is saved.</span>
          </span>
        </span>
        <span class="ms text-on-surface-variant transition-transform group-open:rotate-180">expand_more</span>
      </summary>
      <div class="border-t border-surface-container p-space-lg">
        <label for="debug-jd" class="sa-label">Job description</label>
        <textarea id="debug-jd" rows="8" class="sa-input resize-y" placeholder="Paste the full job description here&hellip;"></textarea>
        <div class="mt-3 flex flex-col gap-2">
          <label class="flex items-center gap-2 text-body-sm text-on-surface">
            <input type="checkbox" id="debug-force-rewrite" class="h-4 w-4 accent-[#9c3e1e]">
            Force the rewrite even if the score passes the fit threshold
          </label>
          <label class="flex items-center gap-2 text-body-sm text-on-surface">
            <input type="checkbox" id="debug-render-pdf" class="h-4 w-4 accent-[#9c3e1e]">
            Also render the PDF (checks formatting, not just the text)
          </label>
        </div>
        <div class="mt-4 flex flex-wrap items-center gap-3">
          <button type="button" id="debug-run" class="sa-btn-primary"><span class="ms text-[18px]">play_arrow</span>Run scoring &amp; tailoring</button>
          <span id="debug-message" class="save-message"></span>
        </div>
        <div id="debug-results" class="mt-5" hidden></div>
      </div>
    </details>
  </div>
</main>


<script src="shell.js"></script>
<script src="config.js"></script>
<script src="why-modal.js"></script>
<script src="ui.js"></script>
<script src="cv.js"></script>
</body>
</html>
