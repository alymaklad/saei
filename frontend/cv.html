<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sa'ei — CV</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="assets/saei-logo.png">
</head>
<body data-page="cv">
<main id="page">
  <div class="flex flex-col">
    <header class="sa-page-head">
      <div>
        <h1 class="sa-page-title">CV</h1>
        <p class="sa-page-desc">Your CV and its tailored versions.</p>
      </div>
    </header>

    <!-- Master CV -->
    <section class="sa-card relative mb-space-xl overflow-hidden p-space-lg">
      <div class="relative" id="cv-current">
        <p class="sa-empty">Loading&hellip;</p>
      </div>
      <input type="file" id="cv-file-input" accept=".pdf,.docx" hidden>
      <p id="upload-message" class="save-message relative mt-space-sm"></p>
    </section>

    <!-- Tailored CVs -->
    <section class="mb-space-xl" aria-labelledby="tailored-h">
      <div class="mb-space-md flex flex-wrap items-end justify-between gap-space-md">
        <h2 class="text-headline-sm text-on-surface" id="tailored-h">Tailored CVs <span class="text-label-md text-on-surface-variant" id="cv-variant-chip"></span></h2>
        <div class="flex items-center gap-space-sm">
          <input type="search" id="cv-filter" class="sa-input w-48 bg-surface-container-lowest py-1.5" placeholder="Filter" aria-label="Filter by role or company">
          <div class="sa-select-wrap">
            <select id="cv-sort" class="sa-select bg-surface-container-lowest py-1.5 text-label-md" aria-label="Sort">
              <option value="date">Newest</option>
              <option value="lift">Biggest gain</option>
              <option value="score">Highest score</option>
            </select>
          </div>
        </div>
      </div>
      <ol class="sa-list" id="cv-rewrites-body"><li class="sa-empty">Loading&hellip;</li></ol>
      <div class="mt-space-sm flex justify-end">
        <button type="button" class="sa-btn-ghost" id="cv-rewrites-more" hidden></button>
      </div>
    </section>

    <!-- Test -->
    <section class="mb-space-lg" aria-labelledby="test-h">
      <h2 class="mb-space-md text-headline-sm text-on-surface" id="test-h">Test against a job</h2>
      <div class="sa-card">
        <textarea id="debug-jd" rows="5" class="sa-input resize-y" aria-label="Job description" placeholder="Paste a job description&hellip;"></textarea>
        <div class="mt-space-md flex flex-wrap items-center gap-x-space-lg gap-y-space-sm">
          <button type="button" id="debug-run" class="sa-btn-primary"><span class="ms text-[18px]">play_arrow</span>Score my CV</button>
          <label class="flex items-center gap-2 text-body-sm text-on-surface">
            <input type="checkbox" id="debug-force-rewrite" class="h-4 w-4 accent-[#9c3e1e]" checked>Always tailor
          </label>
          <label class="flex items-center gap-2 text-body-sm text-on-surface">
            <input type="checkbox" id="debug-render-pdf" class="h-4 w-4 accent-[#9c3e1e]" checked>Make the PDF
          </label>
          <span id="debug-message" class="save-message"></span>
        </div>
        <div id="debug-results" class="mt-space-lg" hidden></div>
      </div>
    </section>
  </div>
</main>


<script src="shell.js"></script>
<script src="config.js"></script>
<script src="why-modal.js"></script>
<script src="ui.js"></script>
<script src="cv.js"></script>
</body>
</html>
