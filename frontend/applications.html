<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sa'ei — Applications</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="assets/saei-logo.png">
</head>
<body data-page="applications">
<main id="page">
  <div class="flex flex-col">
    <header class="sa-page-head">
      <div>
        <h1 class="sa-page-title">Applications</h1>
        <p class="sa-page-desc">Every role Sa'ei found, and what's ready to send.</p>
      </div>
    </header>

    <!-- Apply from a link: one posting through the same pipeline a search runs -->
    <section class="sa-card mb-space-lg p-space-md">
      <form id="link-form" class="flex items-center gap-space-sm">
        <span class="sa-icon-badge flex-shrink-0"><span class="ms">add_link</span></span>
        <label for="link-url" class="sr-only">Job posting URL</label>
        <input type="url" id="link-url" class="sa-input flex-1" required
               placeholder="Paste a job posting link: LinkedIn, Greenhouse, Lever, Ashby or any careers page">
        <button type="submit" class="sa-btn-primary whitespace-nowrap" id="link-btn"><span class="ms text-[18px]">bolt</span>Prepare application</button>
      </form>
      <p id="link-message" class="hidden"></p>
    </section>

    <div class="mb-space-lg flex flex-wrap items-center justify-between gap-space-md">
      <div class="sa-tabs" id="status-tabs">
        <button type="button" class="sa-tab is-active" data-filter="all">All <span class="ml-1 opacity-70" data-count="all"></span></button>
        <button type="button" class="sa-tab" data-filter="pending_review">Ready to apply <span class="ml-1 opacity-70" data-count="pending_review"></span></button>
        <button type="button" class="sa-tab" data-filter="tailored">Tailored <span class="ml-1 opacity-70" data-count="tailored"></span></button>
        <button type="button" class="sa-tab" data-filter="applied">Submitted <span class="ml-1 opacity-70" data-count="applied"></span></button>
      </div>
      <div class="flex items-center gap-space-sm">
        <label class="relative">
          <span class="ms pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant">search</span>
          <input type="text" id="app-filter" class="sa-input w-56 bg-surface-container-lowest py-2 pl-9" placeholder="Filter role or company&hellip;">
        </label>
        <span class="ms text-[18px] text-on-surface-variant">tune</span>
        <div class="sa-select-wrap">
          <select id="sort-select" class="sa-select border-none bg-transparent py-2 pl-1 text-label-md text-on-surface-variant" aria-label="Sort">
            <option value="match_score">Sorted by match</option>
            <option value="ats_score">Sorted by ATS score</option>
            <option value="date_created">Sorted by newest</option>
          </select>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-12 items-start gap-space-lg">
      <!-- List -->
      <div class="col-span-7 flex flex-col gap-space-md">
        <div class="overflow-hidden rounded-xl bg-surface-container-lowest shadow-soft">
          <div class="grid grid-cols-[1fr_7rem_9rem_2.5rem] gap-space-sm bg-surface-container-low px-space-md py-space-sm text-label-md font-semibold text-on-surface-variant">
            <span>Role</span><span>Match</span><span>Status</span><span class="sr-only">Open</span>
          </div>
          <div id="app-list" class="divide-y divide-surface-container">
            <p class="sa-empty">Loading&hellip;</p>
          </div>
          <div class="flex items-center justify-between px-space-md py-space-sm" id="list-footer" hidden>
            <span class="text-body-sm text-on-surface-variant" id="list-count"></span>
            <button type="button" class="sa-btn-ghost" id="list-more">Show more</button>
          </div>
        </div>

      </div>

      <!-- Detail -->
      <aside class="sa-card sticky top-24 col-span-5" id="detail">
        <p class="sa-empty">Select an application.</p>
      </aside>
    </div>
  </div>
</main>

<!-- Submit (email) dialog: what used to be the Email page's send form -->
<div class="modal-overlay" id="send-modal" hidden>
  <div class="modal max-w-2xl" role="dialog" aria-modal="true" aria-labelledby="send-title">
    <form id="send-form" class="flex max-h-[calc(100vh-48px)] flex-col">
      <div class="flex items-start justify-between gap-space-md border-b border-surface-container px-space-lg py-space-md">
        <div>
          <span class="sa-eyebrow">Send application</span>
          <h3 class="text-headline-sm text-on-surface" id="send-title">&mdash;</h3>
        </div>
        <button type="button" class="modal-close" id="send-close" aria-label="Close">&times;</button>
      </div>
      <div class="flex flex-col gap-space-md overflow-y-auto px-space-lg py-space-md">
        <p class="hidden rounded-lg bg-tertiary-fixed/60 px-space-md py-space-sm text-body-sm text-on-tertiary-fixed-variant" id="gmail-warning"></p>
        <div class="grid grid-cols-[4.5rem_1fr] items-center gap-space-sm">
          <label for="to-email" class="text-label-md font-semibold text-on-surface-variant">To</label>
          <input type="text" id="to-email" class="sa-input font-mono" placeholder="hiring@company.com" required>
          <span></span>
          <p class="-mt-1 text-body-sm text-on-surface-variant" id="to-hint"></p>
          <label for="subject" class="text-label-md font-semibold text-on-surface-variant">Subject</label>
          <input type="text" id="subject" class="sa-input font-semibold" required>
        </div>
        <textarea id="body" rows="9" class="sa-input resize-y leading-6" required></textarea>
        <div class="flex items-center gap-space-sm rounded-lg bg-surface-container-low px-space-md py-space-sm" id="attachment"></div>
      </div>
      <div class="flex items-center justify-end gap-space-sm border-t border-surface-container px-space-lg py-space-md">
        <span id="send-message" class="save-message mr-auto"></span>
        <button type="button" class="sa-btn" id="send-cancel">Cancel</button>
        <button type="submit" class="sa-btn-primary" id="send-btn"><span class="ms text-[18px]">send</span>Send application</button>
      </div>
    </form>
  </div>
</div>


<script src="shell.js"></script>
<script src="config.js"></script>
<script src="why-modal.js"></script>
<script src="ui.js"></script>
<script src="applications.js"></script>
</body>
</html>
